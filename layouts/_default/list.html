{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ partial "footnotes.html" . }}
  {{ range .Pages }}
    <article class="post-entry">
      <a href="{{ .Permalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    </article>
  {{ else }}
    <p class="empty">Nothing published here yet.</p>
  {{ end }}
{{ end }}
