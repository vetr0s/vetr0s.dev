name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build without deploying, so a change to the toolchain or the generator is
  # proved before it can reach the live site. The deploy job is skipped below.
  pull_request:
    branches: [main]
  # Rebuild by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Both pinned, because the generator is built from source here rather than
  # downloaded as a release. An unpinned ref would let a push to either repo
  # change this site without a commit in it.
  #
  # A tag rather than a SHA, now that ostat cuts releases. A tag can be moved,
  # which a SHA cannot, so this trades a little immutability for a ref that
  # says which version of the generator built the site.
  OSTAT_REF: v0.3.0
  ODIN_VERSION: dev-2026-07

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check out ostat
        uses: actions/checkout@v4
        with:
          repository: vetr0s/ostat
          ref: ${{ env.OSTAT_REF }}
          path: .ostat

      # ostat links libcmark through vendor:commonmark, and Odin shells out to
      # clang to link. Neither is on a runner by default.
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libcmark-dev

      - name: Cache the Odin toolchain
        id: odin-cache
        uses: actions/cache@v4
        with:
          path: .odin
          key: odin-${{ env.ODIN_VERSION }}-${{ runner.os }}

      - name: Install Odin
        if: steps.odin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .odin
          curl --fail --silent --show-error --location \
            -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz"
          # The archive nests one directory named for the nightly build date,
          # not for the tag, so it cannot be written down here. Strip it.
          tar xzf odin.tar.gz -C .odin --strip-components=1
          chmod +x .odin/odin

      - name: Build ostat
        run: |
          export PATH="$PWD/.odin:$PATH"
          cd .ostat && ./build.sh release

      # No -drafts and no -future: this is what the world sees.
      - name: Build the site
        run: .ostat/build/release/ostat build . -o public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # A pull request builds and stops. Publishing is what merging to main is
    # for, and a PR that could deploy would make the check pointless.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
