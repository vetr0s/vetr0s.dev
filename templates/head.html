<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$pagetitle$</title>
<meta name="description" content="$pagedesc$">
<meta name="author" content="$site.author$">
<link rel="canonical" href="$pageurl$">
<meta property="og:type" content="$ogtype$">
<meta property="og:site_name" content="$site.title$">
<meta property="og:locale" content="$site.locale$">
<meta property="og:title" content="$socialtitle$">
<meta property="og:description" content="$pagedesc$">
<meta property="og:url" content="$pageurl$">
$if(socialimage)$<meta property="og:image" content="$socialimage$">
<meta property="og:image:alt" content="$image_alt$">
$endif$$for(tags)$<meta property="article:tag" content="$it$">
$endfor$<meta name="twitter:card" content="$if(socialimage)$summary_large_image$else$summary$endif$">
<meta name="twitter:title" content="$socialtitle$">
<meta name="twitter:description" content="$pagedesc$">
$if(socialimage)$<meta name="twitter:image" content="$socialimage$">
<meta name="twitter:image:alt" content="$image_alt$">
$endif$$if(feed)$<link rel="alternate" type="application/rss+xml" href="$feed$" title="$pagetitle$">
$endif$<script>
  (function () {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
    }
  })();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- The roman cut starts downloading here, during HTML parse, rather than
     after the stylesheet is parsed and a glyph is first wanted. font-display
     is optional, so being ready by first paint is the difference between the
     page being set in ET Book and being set in Palatino. crossorigin is
     required on a font preload even same-origin, or the fetch is made twice. -->
<link rel="preload" href="/font/et-book-roman-line-figures.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js" defer></script>
</head>
