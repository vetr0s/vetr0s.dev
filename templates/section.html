$head()$
<body>
  <header>
$crumbs()$
  </header>
  <main>
  <div class="section-head">
    <h1>$title$</h1>
$if(feedpath)$    <a class="rss-badge" href="$feedpath$" title="RSS feed">RSS</a>
$endif$  </div>
$body$$for(entries)$  <article class="post-entry">
    <a href="$it.url$">$it.title$</a>
$if(it.date)$    <time datetime="$it.date$">$it.date$</time>
$endif$$if(it.summary)$    <p class="entry-summary">$it.summary$</p>
$endif$  </article>
$endfor$$if(empty)$  <p class="empty">$emptytext$</p>
$endif$  </main>
</body>
</html>
